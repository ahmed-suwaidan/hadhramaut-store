<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر حضرموت الذكي | التسوق المباشر</title>
  
  <!-- إعدادات تطبيق الجوال (PWA) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="متجر حضرموت">
  <meta name="theme-color" content="#d4af37">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0c0e12;
      --card-bg: #161920;
      --gold: #d4af37;
      --gold-hover: #b89628;
      --text: #f0f2f5;
      --text-muted: #9ba1a6;
      --border: rgba(212, 175, 55, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 90px; }
    
    header {
      background: rgba(22, 25, 32, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(10px);
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 8px; }
    .cart-btn {
      background: var(--gold); color: #000; border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
      font-size: 0.95rem; transition: 0.2s;
    }
    .cart-btn:hover { background: var(--gold-hover); }

    .hero { text-align: center; padding: 30px 15px 15px; }
    .hero h1 { font-size: 1.8rem; color: #fff; margin-bottom: 8px; font-weight: 800; }
    .hero p { color: var(--text-muted); font-size: 0.95rem; }

    .categories { display: flex; justify-content: center; gap: 8px; padding: 15px; flex-wrap: wrap; }
    .cat-btn {
      background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border);
      padding: 7px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 0.9rem;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }

    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px; padding: 15px; max-width: 1200px; margin: auto;
    }
    .card {
      background: var(--card-bg); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #222; }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
    .card-price { font-size: 1.15rem; color: var(--gold); font-weight: 800; margin-bottom: 12px; }
    .add-to-cart {
      background: transparent; color: var(--gold); border: 1px solid var(--gold);
      padding: 9px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;
    }
    .add-to-cart:hover { background: var(--gold); color: #000; }

    /* نافذة السلة المنسدلة */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 200; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
      background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 16px;
      padding: 22px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.88rem; color: var(--text-muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; background: #0c0e12; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem;
    }
    .submit-order {
      background: var(--gold); color: #000; border: none; width: 100%; padding: 12px;
      border-radius: 8px; font-size: 1.05rem; font-weight: 800; cursor: pointer; margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-store"></i> متجر حضرموت الذكي</div>
    <button class="cart-btn" onclick="openCart()">
      <i class="fa-solid fa-bag-shopping"></i> السلة (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>سوق حضرموت للتجارة والتسوق</h1>
    <p>خدمة توصيل فورية لكافة مدن حضرموت (تريم، سيئون، المكلا، الشحر) وباقي المحافظات</p>
  </section>

  <div class="categories">
    <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
    <button class="cat-btn" onclick="filterCategory('منتجات محلية')">منتجات محلية</button>
    <button class="cat-btn" onclick="filterCategory('عطور وبخور')">عطور وبخور</button>
    <button class="cat-btn" onclick="filterCategory('إلكترونيات وساعات')">إلكترونيات</button>
  </div>

  <main class="products-grid" id="products-container">
    <p style="text-align: center; grid-column: 1/-1;">جاري تجهيز وعرض المنتجات...</p>
  </main>

  <!-- نافذة السلة وإتمام الشراء -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</h3>
        <button class="close-btn" onclick="closeCart()">&times;</button>
      </div>
      
      <div id="cart-items" style="margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px;"></div>
      
      <div style="font-size: 1.2rem; font-weight: bold; color: var(--gold); margin-bottom: 18px; display:flex; justify-content:space-between;">
        <span>الإجمالي النهائي:</span>
        <span id="cart-total">0 ر.ي</span>
      </div>

      <form id="order-form" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label>الاسم الكامل:</label>
          <input type="text" id="cust-name" required placeholder="أدخل اسمك الكريم">
        </div>
        <div class="form-group">
          <label>رقم الواتساب / الجوال:</label>
          <input type="tel" id="cust-phone" required placeholder="77xxxxxxx">
        </div>
        <div class="form-group">
          <label>المدينة / العنوان:</label>
          <select id="cust-city">
            <option>تريم</option>
            <option>سيئون</option>
            <option>المكلا</option>
            <option>الشحر</option>
            <option>شوامخ والوديان</option>
            <option>محافظة أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label>طريقة الدفع المناسبة:</label>
          <select id="cust-pay">
            <option>الدفع عند الاستلام</option>
            <option>حساب الكريمي (جوالي)</option>
            <option>حساب العمقي</option>
          </select>
        </div>
        <button type="submit" class="submit-order">تأكيد وإرسال الطلب الآن</button>
      </form>
    </div>
  </div>

  <script>
    let allProducts = [];
    let cart = [];

    // تسجيل تطبيق الجوال PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (err) {
        document.getElementById('products-container').innerHTML = '<p style="text-align:center;grid-column:1/-1;">تعذر جلب المنتجات حالياً.</p>';
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('products-container');
      if (products.length === 0) {
        container.innerHTML = '<p style="text-align:center;grid-column:1/-1;">لا توجد منتجات متاحة حالياً.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.name}">
          <div class="card-body">
            <div>
              <div class="card-title">${p.name}</div>
              <div class="card-desc">${p.description || ''}</div>
            </div>
            <div>
              <div class="card-price">${p.price.toLocaleString()} ر.ي</div>
              <button class="add-to-cart" onclick="addToCart(${p.id})">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'الكل') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function addToCart(id) {
      const item = allProducts.find(p => p.id === id);
      if (item) {
        cart.push(item);
        document.getElementById('cart-count').innerText = cart.length;
        alert(`تمت إضافة "${item.name}" إلى سلة المشتريات!`);
      }
    }

    function openCart() {
      if (cart.length === 0) {
        alert("سلتك فارغة حالياً! اختر منتجات لإضافتها أولاً.");
        return;
      }
      const cartContainer = document.getElementById('cart-items');
      let total = 0;
      cartContainer.innerHTML = cart.map((p) => {
        total += p.price;
        return `<div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.95rem;">
          <span>${p.name}</span>
          <span style="color:var(--gold); font-weight:bold;">${p.price.toLocaleString()} ر.ي</span>
        </div>`;
      }).join('');
      document.getElementById('cart-total').innerText = total.toLocaleString() + ' ر.ي';
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    async function handleCheckout(e) {
      e.preventDefault();
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const payload = {
        customer_name: document.getElementById('cust-name').value,
        customer_phone: document.getElementById('cust-phone').value,
        city: document.getElementById('cust-city').value,
        payment_method: document.getElementById('cust-pay').value,
        items_json: JSON.stringify(cart.map(c => c.name)),
        total_price: total
      };

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert("تم تسجيل طلبك بنجاح! سيتم التواصل معك عبر الواتساب لتأكيد الشحن.");
          cart = [];
          document.getElementById('cart-count').innerText = "0";
          closeCart();
        }
      } catch (err) {
        alert("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.");
      }
    }

    loadProducts();
  </script>
</body>
</html>
